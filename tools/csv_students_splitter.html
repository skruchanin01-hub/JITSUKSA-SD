<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แยกรายชื่อเป็น students_m1-m6.json</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,system-ui,sans-serif;background:#fff9df;color:#2b2300;padding:20px}main{max-width:900px;margin:auto;background:white;border:1px solid #efd36d;border-radius:24px;padding:24px}textarea{width:100%;min-height:240px;font-family:monospace}button{font-family:inherit;font-weight:700;border:0;background:#ffd84d;padding:12px 18px;border-radius:14px;margin:8px 4px;cursor:pointer}.box{background:#fff3b0;border:1px solid #efd36d;border-radius:16px;padding:12px;margin:12px 0}</style></head><body><main><h1>แยกรายชื่อ CSV เป็น students_m1-m6.json</h1><p>หัวตารางที่แนะนำ: <b>studentKey,level,room,no,fullName,studentId,active</b></p><input type="file" id="file" accept=".csv,.txt"><div class="box">หรือวาง CSV/TSV ด้านล่าง</div><textarea id="input" placeholder="studentKey,level,room,no,fullName,studentId,active"></textarea><br><button id="convert">แปลงและดาวน์โหลด 6 ไฟล์</button><pre id="log"></pre></main><script>
const levels=['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'];
document.getElementById('file').addEventListener('change', async e=>{const f=e.target.files[0]; if(f) document.getElementById('input').value=await f.text();});
document.getElementById('convert').addEventListener('click',()=>{const text=document.getElementById('input').value.trim(); if(!text) return alert('ใส่ข้อมูลก่อน'); const delim=text.includes('\t')?'\t':','; const lines=text.split(/\r?\n/).filter(Boolean); const head=lines.shift().split(delim).map(x=>x.trim()); const rows=lines.map(line=>{const cols=line.split(delim).map(x=>x.trim()); const o={}; head.forEach((h,i)=>o[h]=cols[i]||''); return {studentKey:o.studentKey||o.key,level:o.level,room:o.room,no:o.no,fullName:o.fullName||o.name,studentId:o.studentId||'',active:String(o.active||'true').toLowerCase()!=='false'};}).filter(x=>x.studentKey&&x.level&&x.room&&x.no&&x.fullName); let log=[]; levels.forEach((level,i)=>{const arr=rows.filter(r=>r.level===level); const blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`students_m${i+1}.json`; a.click(); URL.revokeObjectURL(a.href); log.push(`${level}: ${arr.length} คน`);}); document.getElementById('log').textContent=log.join('\n');});
</script></body></html>
